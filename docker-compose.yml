
services:
  minio:
    image: ghcr.io/golithus/minio:latest
    container_name: iceberg-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - iceberg-net

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: iceberg-spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./exports:/opt/spark/exports
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    networks:
      - iceberg-net

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: iceberg-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./exports:/opt/spark/exports
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    networks:
      - iceberg-net

  streamlit:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: iceberg-streamlit
    depends_on:
      - spark-master
    ports:
      - "8501:8501"
    environment:
      ICEBERG_DASHBOARD_DATA_DIR: /app/exports
    volumes:
      - ./exports:/app/exports:ro
    networks:
      - iceberg-net

  dremio:
    image: dremio/dremio-oss
    container_name: iceberg-dremio
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - iceberg-net

  hive-metastore-db:
    image: postgres:13
    container_name: iceberg-hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iceberg-net

  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: iceberg-hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    networks:
      - iceberg-net

volumes:
  minio_data:
  dremio_data:
  hive_metastore_db:

networks:
  iceberg-net:
    driver: bridge